# Per-request model failover. One Anthropic-Messages endpoint; every request walks an
# ordered chain and ends at a local Ollama model. The harness is not told it happened.
# Rationale, measured numbers and the policy carve-out: gateway/README.md.
#
# No credential is written in this file. Every upstream value arrives through
# os.environ/*, so the primary tier can be Bedrock or direct Anthropic without an edit.
# gateway/up.sh supplies a default for each variable this file reads.

model_list:
  # Tier 1 — cloud. FACTORY_PRIMARY_MODEL carries its own provider prefix
  # (bedrock/..., anthropic/...), so credentials resolve from that provider's ambient
  # environment (AWS_PROFILE / AWS_REGION, or ANTHROPIC_API_KEY) and never land here.
  # FACTORY_PRIMARY_API_BASE must be a real endpoint, never empty — LiteLLM's Bedrock path
  # treats "" as an endpoint and dies. gateway/up.sh resolves the default per provider.
  # gateway/probe.sh --induce-failure overrides it with a dead host, which is the only
  # honest way to test a fallback.
  - model_name: factory-primary
    litellm_params:
      model: os.environ/FACTORY_PRIMARY_MODEL
      api_base: os.environ/FACTORY_PRIMARY_API_BASE

  # Tiers 2 and 3 — local. `anthropic/<model>` against Ollama's native /v1/messages is a
  # passthrough, not a translation: it drops a hop, keeps cache_read_input_tokens intact,
  # and avoids LiteLLM emitting a null thinking.signature and an empty text block beside
  # tool_use.
  #
  # Tradeoff of the passthrough path: num_ctx in litellm_params is SILENTLY IGNORED here.
  # Context is governed server-side by OLLAMA_CONTEXT_LENGTH, which gateway/up.sh refuses
  # to start without. Do not add num_ctx below expecting it to take effect.
  - model_name: local-oss
    litellm_params:
      model: anthropic/gpt-oss:20b
      api_base: http://localhost:11434
      # LiteLLM's Anthropic handler demands a key. Ollama ignores the value.
      api_key: ollama-local

  # Second local model, for when the first is evicted from VRAM or fails to load.
  - model_name: local-qwen
    litellm_params:
      model: anthropic/qwen3:8b
      api_base: http://localhost:11434
      api_key: ollama-local

  # Required, not cosmetic. Claude Code issues haiku-class calls under model names this
  # chain does not define, and without a wildcard entry every one of them 400s.
  - model_name: "*"
    litellm_params:
      model: anthropic/gpt-oss:20b
      api_base: http://localhost:11434
      api_key: ollama-local

router_settings:
  # The ordered chain. Covers auth, quota, network, 5xx, timeout, malformed and unknown —
  # every failure class except one.
  fallbacks:
    - factory-primary: ["local-oss", "local-qwen"]
    - local-oss: ["local-qwen"]

  # content_policy_fallbacks IS DELIBERATELY UNSET AND MUST STAY UNSET.
  # A safety or policy refusal is an answer, not an outage. Re-rolling it on a second
  # model until one complies is laundering, not failover.

  # An unattended run cannot wait out a cooldown, and a retry against a dead credential
  # only spends wall clock. Fail the group over on the first error instead.
  num_retries: 0
  allowed_fails: 100
  cooldown_time: 0

litellm_settings:
  # Claude Code sends fields no local model accepts. Dropping them beats 400ing the turn.
  drop_params: true

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY
