# Provider registry. One row per model source; the ORDER of FACTORY_MODEL_CHAIN decides
# which is primary and which are fallbacks, so a local model is primary or backstop by
# configuration alone — no edit here and none in gateway/litellm.yaml.
#
# bin/render-gateway-config.mjs turns this plus the chain into the LiteLLM config, and
# gateway/up.sh reads the same rows for its preconditions. One source, because a provider
# named one thing here and another in the launcher fails silently and totally.
#
# Columns, pipe-delimited:
#   name      chain token, and the model_name the harness sees
#   model     LiteLLM model string; the prefix picks the API shape
#             (anthropic/* and bedrock/* speak Anthropic, openai/* speaks chat-completions)
#   api_base  endpoint; ${VAR} expands from the environment
#   local     yes = runs on this machine, so it costs memory rather than money
#   tools     yes | no | unknown. A provider that cannot emit tool_use cannot be primary:
#             it cannot drive an agentic run at all. `unknown` is probed before use.
#
# name   | model                             | api_base                      | local | tools
cloud    | ${FACTORY_PRIMARY_MODEL}          | ${FACTORY_PRIMARY_API_BASE}   | no    | yes

# Ollama speaks the Anthropic Messages API natively, so this is a passthrough rather than a
# translation: one hop fewer, cache_read_input_tokens preserved, and none of LiteLLM's
# Anthropic-shape quirks. Context is server-side via OLLAMA_CONTEXT_LENGTH.
ollama   | anthropic/${FACTORY_OLLAMA_MODEL} | http://localhost:11434        | yes   | yes

# Second Ollama model, for when the first is evicted from memory or will not load.
ollama2  | anthropic/${FACTORY_OLLAMA_MODEL2}| http://localhost:11434        | yes   | yes

# MLX. Apple-silicon inference, usually faster per token than Ollama, but it speaks OpenAI
# chat-completions so LiteLLM translates. tools=unknown deliberately: mlx-lm's server has
# had patchy tool-calling support, and an agentic run is useless without it. up.sh probes
# before letting it lead — unverified capability is not a capability.
mlx      | openai/${FACTORY_MLX_MODEL}       | ${FACTORY_MLX_API_BASE}       | yes   | unknown
